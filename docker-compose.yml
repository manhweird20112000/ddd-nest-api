services:
  math-service:
    build:
      context: ../math-service
      dockerfile: Dockerfile
    image: math-service:local
    environment:
      MATH_SERVICE_HOST: 0.0.0.0
      MATH_SERVICE_PORT: 3001
    expose:
      - "3001"
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-gateway:local
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      MATH_SERVICE_HOST: math-service
      MATH_SERVICE_PORT: 3001
    depends_on:
      - math-service
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS "http://127.0.0.1:$${APP_PORT:-3000}/health" || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
